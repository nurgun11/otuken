<!DOCTYPE html>
<html>
<head>
    <title>News Image Placeholder</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }
        .placeholder {
            width: 800px;
            height: 400px;
            background-color: #2C3E50;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }
        p {
            font-size: 18px;
            margin-top: 0;
        }
    </style>
</head>
<body>
    <div class="placeholder">
        <h1>Отюкен Фестиваль</h1>
        <p>Изображение новости</p>
    </div>
</body>
</html>
