<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otuken Festival Theme Screenshot</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #2C3E50;
            font-family: 'Montserrat', sans-serif;
        }
        
        .screenshot {
            width: 1200px;
            height: 900px;
            background-color: #2C3E50;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }
        
        .logo {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }
        
        .tagline {
            font-size: 24px;
            margin-bottom: 40px;
            opacity: 0.8;
        }
        
        .decoration {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
            overflow: hidden;
        }
        
        .circle {
            position: absolute;
            border-radius: 50%;
            opacity: 0.1;
        }
        
        .circle-1 {
            width: 600px;
            height: 600px;
            background-color: #E74C3C;
            top: -200px;
            left: -200px;
        }
        
        .circle-2 {
            width: 400px;
            height: 400px;
            background-color: #F1C40F;
            bottom: -100px;
            right: -100px;
        }
        
        .circle-3 {
            width: 300px;
            height: 300px;
            background-color: #3498DB;
            top: 50%;
            right: 10%;
            transform: translateY(-50%);
        }
        
        .content {
            position: relative;
            z-index: 1;
        }
        
        .features {
            display: flex;
            justify-content: space-around;
            width: 100%;
            margin-top: 40px;
        }
        
        .feature {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            width: 25%;
            margin: 0 10px;
        }
        
        .feature-icon {
            font-size: 36px;
            margin-bottom: 15px;
        }
        
        .feature-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .feature-desc {
            font-size: 14px;
            opacity: 0.8;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="screenshot">
        <div class="decoration">
            <div class="circle circle-1"></div>
            <div class="circle circle-2"></div>
            <div class="circle circle-3"></div>
        </div>
        
        <div class="content">
            <div class="logo">ОТЮКЕН</div>
            <div class="tagline">Международный этнокультурный фестиваль</div>
            
            <div class="features">
                <div class="feature">
                    <div class="feature-icon">🌍</div>
                    <div class="feature-title">Многоязычность</div>
                    <div class="feature-desc">Поддержка русского, английского, турецкого и монгольского языков</div>
                </div>
                <div class="feature">
                    <div class="feature-icon">📱</div>
                    <div class="feature-title">Адаптивный дизайн</div>
                    <div class="feature-desc">Оптимизировано для всех устройств</div>
                </div>
                <div class="feature">
                    <div class="feature-icon">📰</div>
                    <div class="feature-title">Новостной блок</div>
                    <div class="feature-desc">Управление новостями и событиями фестиваля</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
